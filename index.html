<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Marito - A classic Super Mario style platformer game built with HTML5 Canvas">
    <meta name="keywords" content="mario, platformer, game, html5, canvas, javascript">
    <title>Marito - Super Mario Platform Game</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="gameContainer" role="application" aria-label="Marito Platform Game">
        <canvas id="gameCanvas" width="1024" height="576" role="img" aria-label="Game canvas"></canvas>

        <div id="ui" role="status" aria-live="polite" aria-atomic="true">
            <div>Score: <span id="score" aria-label="Current score">0</span></div>
            <div>Coins: <span id="coins" aria-label="Coins collected">0</span></div>
            <div>Lives: <span id="lives" aria-label="Remaining lives">3</span></div>
            <div>Time: <span id="time" aria-label="Time remaining">400</span></div>
            <div>World: <span id="world" aria-label="Current world">1-1</span></div>
        </div>

        <div id="mainMenu" role="dialog" aria-labelledby="mainMenuTitle" aria-modal="true">
            <h1 id="mainMenuTitle">🍄 Super Mario Platform</h1>
            <p>A classic platformer adventure!</p>
            <nav aria-label="Main menu">
                <button onclick="game.startGame()" aria-label="Start a new game">Start Game</button>
                <button onclick="game.showLevelSelect()" aria-label="Select a level to play">Level Select</button>
                <button onclick="game.showHighScores()" aria-label="View high scores">High Scores</button>
                <button onclick="achievementsUI.showUI()" aria-label="View achievements">🏆 Achievements</button>
                <button onclick="settingsManager.showUI()" aria-label="Open settings menu">⚙️ Settings</button>
            </nav>
        </div>

        <div id="gameOver" role="dialog" aria-labelledby="gameOverTitle" aria-modal="true">
            <h2 id="gameOverTitle">Game Over!</h2>
            <p>Final Score: <span id="finalScore" aria-label="Final score">0</span></p>
            <nav aria-label="Game over options">
                <button onclick="game.restart()" aria-label="Try again">Try Again</button>
                <button onclick="game.showMainMenu()" aria-label="Return to main menu">Main Menu</button>
            </nav>
        </div>

        <div id="levelComplete" role="dialog" aria-labelledby="levelCompleteTitle" aria-modal="true">
            <h2 id="levelCompleteTitle">Level Complete!</h2>
            <p>Score: <span id="levelScore" aria-label="Level score">0</span></p>
            <nav aria-label="Level complete options">
                <button onclick="game.nextLevel()" aria-label="Continue to next level">Next Level</button>
                <button onclick="game.showMainMenu()" aria-label="Return to main menu">Main Menu</button>
            </nav>
        </div>

        <aside id="controls" aria-label="Game controls">
            <div>Arrow Keys: Move</div>
            <div>Space: Jump</div>
            <div>P: Pause</div>
        </aside>
    </div>

    <script src="js/config.js"></script>
    <script src="js/level-data.js"></script>
    <script src="js/error-handler.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/settings-manager.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/achievements-ui.js"></script>
    <script src="js/transitions.js"></script>
    <script src="js/performance-monitor.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/spatial-grid.js"></script>
    <script src="js/touch-controls.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/player.js"></script>
    <script src="js/enemies.js"></script>
    <script src="js/powerups.js"></script>
    <script src="js/level.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
